# Stable overlay for a bundled PostgreSQL (BREVITY_DATABASE=bundled): the database lives in
# the stable project next to Redis and survives releases. Data is on the named volume
# brevity_pgsql_data; generations reach it at DB_HOST=pgsql over the brevity_proxy network.
services:
  pgsql:
    image: postgres:17-alpine
    container_name: pgsql
    restart: always
    environment:
      POSTGRES_DB: "${DB_DATABASE:?set DB_DATABASE}"
      POSTGRES_USER: "${DB_USERNAME:?set DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy

volumes:
  pgsql_data:
