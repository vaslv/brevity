# Generation overlay for PostgreSQL managed on the host (BREVITY_DATABASE=host).
# Every role joins the existing Docker network the host database listens on;
# deploy-host.sh passes DATABASE_NETWORK from the server .env.
services:
  web:
    networks:
      database: {}

  scheduler:
    networks:
      - backend
      - database

  horizon:
    networks:
      - backend
      - database

networks:
  database:
    external: true
    name: ${DATABASE_NETWORK:?set DATABASE_NETWORK to the network of the host PostgreSQL}
