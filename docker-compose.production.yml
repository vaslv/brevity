# Stable part of a production installation: the application Caddy and Redis. They outlive
# releases; web, Horizon and the scheduler run as generations (docker-compose.generation.yml).
# Manage it only through deploy-host.sh, which derives CADDY_SITE_ADDRESSES and the profile.
#
# The project name is fixed so it does not depend on the deploy directory. Named volumes and
# networks are prefixed with it; changing it orphans brevity_redis_data and brevity_geoip_data.
name: brevity

x-caddy: &caddy
  image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
  user: "65532:65532"
  command: ["caddy", "run", "--config", "/etc/caddy/conf/Caddyfile", "--adapter", "caddyfile"]
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  sysctls:
    net.ipv4.ip_unprivileged_port_start: "0"
  mem_limit: 256m
  cpus: 1.0
  tmpfs:
    - /tmp
  volumes:
    # A directory, never single files: deploy-host.sh replaces Caddyfile and upstream.caddy
    # atomically, and a file bind mount would keep showing the old inode.
    - type: bind
      source: ./caddy/conf
      target: /etc/caddy/conf
      read_only: true
      bind:
        create_host_path: false
    # ACME account and certificates: back up and move them with the installation.
    - type: bind
      source: ./caddy/data
      target: /data
      bind:
        create_host_path: false
    - type: bind
      source: ./caddy/config
      target: /config
      bind:
        create_host_path: false
  healthcheck:
    # Healthy only with this Caddyfile loaded and routing to the upstream on disk.
    test:
      - CMD-SHELL
      - >-
        set -- $$(cat /etc/caddy/conf/upstream.caddy) &&
        config=$$(curl -fsS --max-time 3 http://127.0.0.1:2019/config/apps/http/servers) &&
        case "$$2" in
        brevity_maintenance) printf %s "$$config" | grep -qF '"status_code":503' ;;
        *) printf %s "$$config" | grep -qF "\"dial\":\"$$3\"" ;;
        esac
    interval: 10s
    timeout: 5s
    retries: 3
    start_interval: 2s
    start_period: 10s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"
  # Longer than grace_period in the Caddyfile.
  stop_grace_period: 100s
  restart: unless-stopped
  networks: [apps]

services:
  caddy-public:
    <<: *caddy
    profiles: [public]
    environment:
      CADDY_MODE: public
      CADDY_SITE_ADDRESSES: ${CADDY_SITE_ADDRESSES:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      TLS_MAX: ${TLS_MAX:-tls1.3}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"

  caddy-behind-host:
    <<: *caddy
    profiles: [behind-host]
    environment:
      CADDY_MODE: behind-host
      CADDY_TRUSTED_PROXY: ${CADDY_TRUSTED_PROXY:-}
    ports:
      # Loopback only: the bridge address proves nothing about who connected.
      - "127.0.0.1:${CADDY_PORT:-8082}:8080"

  # Unchanged since before the Caddy entrance: a changed definition would recreate Redis.
  redis:
    image: redis:8.4.2-alpine
    container_name: redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - proxy

volumes:
  redis_data:

networks:
  # Generations reach Redis (and the bundled PostgreSQL) here as brevity_proxy.
  proxy:
    driver: bridge
  # Caddy and the web role of every generation. The subnet is fixed: the application trusts
  # X-Forwarded-* only from it (TRUSTED_PROXIES), and its gateway is the address the host web
  # server connects from (CADDY_TRUSTED_PROXY).
  apps:
    name: brevity-apps
    ipam:
      config:
        - subnet: ${BREVITY_APPS_SUBNET:-172.31.250.0/24}
